[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "paris"          # Polygon Amoy / PoS friendly (no PUSH0)

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

# Used by forge create / scripts. Values come from env at runtime — never hardcode keys.
[rpc_endpoints]
amoy = "${RPC_URL}"

[etherscan]
amoy = { key = "${POLYGONSCAN_API_KEY}", chain = 80002 }
